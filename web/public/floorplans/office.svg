<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#eef2f7" stroke-width="1"/>
    </pattern>
    <marker id="tick" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 0 10" stroke="#94a3b8" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="800" height="600" fill="#ffffff"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- Title block -->
  <g font-size="12">
    <rect x="70" y="14" width="360" height="42" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="84" y="31" fill="#0f172a" font-weight="700" font-size="14">EXECUTIVE OFFICE · ELEVATE BUSINESS PARK</text>
    <text x="84" y="47" fill="#64748b">2nd Floor · Typical Floor Plan · Carpet ≈ 1,900 sq.ft</text>
    <text x="438" y="40" fill="#94a3b8" font-style="italic">NOT TO SCALE</text>
  </g>

  <!-- North arrow -->
  <g transform="translate(756,40)">
    <path d="M 0 -16 L 5 6 L 0 1 L -5 6 Z" fill="#334155"/>
    <text x="0" y="14" fill="#475569" font-size="10" text-anchor="middle" font-weight="600">N</text>
  </g>

  <!-- Exterior walls (left wall gapped for entrance) -->
  <g stroke="#1e293b" stroke-linecap="round">
    <line x1="70" y1="70" x2="730" y2="70" stroke-width="7"/>
    <line x1="70" y1="540" x2="730" y2="540" stroke-width="7"/>
    <line x1="730" y1="70" x2="730" y2="540" stroke-width="7"/>
    <line x1="70" y1="70" x2="70" y2="378" stroke-width="7"/>
    <line x1="70" y1="416" x2="70" y2="540" stroke-width="7"/>
  </g>

  <!-- Interior walls -->
  <g stroke="#1e293b" stroke-linecap="round">
    <line x1="470" y1="70" x2="470" y2="128" stroke-width="4"/>
    <line x1="470" y1="164" x2="470" y2="258" stroke-width="4"/>
    <line x1="470" y1="294" x2="470" y2="340" stroke-width="4"/>
    <line x1="557" y1="70" x2="557" y2="340" stroke-width="4"/>
    <line x1="644" y1="70" x2="644" y2="340" stroke-width="4"/>
    <line x1="70" y1="340" x2="194" y2="340" stroke-width="4"/>
    <line x1="228" y1="340" x2="470" y2="340" stroke-width="4"/>
    <line x1="470" y1="340" x2="730" y2="340" stroke-width="4"/>
    <line x1="260" y1="340" x2="260" y2="426" stroke-width="4"/>
    <line x1="260" y1="462" x2="260" y2="540" stroke-width="4"/>
    <line x1="380" y1="340" x2="380" y2="426" stroke-width="4"/>
    <line x1="380" y1="462" x2="380" y2="540" stroke-width="4"/>
    <line x1="470" y1="340" x2="470" y2="426" stroke-width="4"/>
    <line x1="470" y1="462" x2="470" y2="540" stroke-width="4"/>
  </g>

  <!-- Door swings -->
  <g stroke="#334155" fill="none" stroke-width="2">
    <path d="M 70 416 A 30 30 0 0 0 100 386"/>
    <line x1="70" y1="416" x2="100" y2="416"/>
    <path d="M 228 340 A 28 28 0 0 1 228 368"/>
    <line x1="228" y1="340" x2="228" y2="368"/>
    <path d="M 470 164 A 24 24 0 0 1 494 188"/>
    <line x1="470" y1="164" x2="470" y2="188"/>
    <path d="M 470 294 A 24 24 0 0 1 494 318"/>
    <line x1="470" y1="294" x2="470" y2="318"/>
    <path d="M 260 462 A 26 26 0 0 1 286 488"/>
    <line x1="260" y1="462" x2="286" y2="462"/>
    <path d="M 380 462 A 26 26 0 0 1 380 488"/>
    <line x1="380" y1="462" x2="380" y2="488"/>
    <path d="M 470 462 A 26 26 0 0 1 470 488"/>
    <line x1="470" y1="462" x2="470" y2="488"/>
  </g>

  <!-- Room labels -->
  <g text-anchor="middle">
    <text x="270" y="195" fill="#0f172a" font-size="15" font-weight="700">OPEN WORK AREA</text>
    <text x="270" y="215" fill="#475569" font-size="12">25'0" × 18'0"</text>
    <text x="270" y="233" fill="#94a3b8" font-size="11">≈ 450 sq.ft</text>

    <text x="513" y="200" fill="#0f172a" font-size="13" font-weight="700">CABIN A</text>
    <text x="513" y="218" fill="#94a3b8" font-size="10.5">5'0" × 10'0"</text>

    <text x="600" y="200" fill="#0f172a" font-size="13" font-weight="700">CABIN B</text>
    <text x="600" y="218" fill="#94a3b8" font-size="10.5">5'0" × 10'0"</text>

    <text x="687" y="200" fill="#0f172a" font-size="13" font-weight="700">CABIN C</text>
    <text x="687" y="218" fill="#94a3b8" font-size="10.5">5'0" × 10'0"</text>

    <text x="165" y="430" fill="#0f172a" font-size="14" font-weight="700">RECEPTION</text>
    <text x="165" y="448" fill="#475569" font-size="11.5">11'6" × 12'6"</text>
    <text x="165" y="465" fill="#94a3b8" font-size="10.5">≈ 144 sq.ft</text>

    <text x="320" y="438" fill="#0f172a" font-size="13" font-weight="700">PANTRY</text>
    <text x="320" y="456" fill="#94a3b8" font-size="10.5">7'6" × 12'6"</text>

    <text x="425" y="430" fill="#0f172a" font-size="13" font-weight="700">WC</text>
    <text x="425" y="448" fill="#94a3b8" font-size="10.5">5'6" × 8'0"</text>

    <text x="600" y="430" fill="#0f172a" font-size="14" font-weight="700">MEETING ROOM</text>
    <text x="600" y="448" fill="#475569" font-size="11.5">16'0" × 12'6"</text>
    <text x="600" y="465" fill="#94a3b8" font-size="10.5">≈ 200 sq.ft</text>
  </g>

  <!-- Overall dimensions -->
  <g stroke="#94a3b8" stroke-width="1.5" marker-start="url(#tick)" marker-end="url(#tick)">
    <line x1="70" y1="558" x2="730" y2="558"/>
    <line x1="70" y1="545" x2="70" y2="571"/>
    <line x1="730" y1="545" x2="730" y2="571"/>
    <line x1="762" y1="70" x2="762" y2="540"/>
    <line x1="748" y1="70" x2="776" y2="70"/>
    <line x1="748" y1="540" x2="776" y2="540"/>
  </g>
  <g fill="#475569" font-size="13" font-weight="600">
    <text x="400" y="576" text-anchor="middle">41'-6"</text>
    <text x="778" y="311" text-anchor="middle">33'-0"</text>
  </g>

  <!-- Scale bar -->
  <g transform="translate(500,572)">
    <line x1="0" y1="0" x2="120" y2="0" stroke="#475569" stroke-width="3"/>
    <line x1="30" y1="-3" x2="30" y2="3" stroke="#475569" stroke-width="3"/>
    <line x1="60" y1="-3" x2="60" y2="3" stroke="#475569" stroke-width="3"/>
    <line x1="90" y1="-3" x2="90" y2="3" stroke="#475569" stroke-width="3"/>
    <text x="60" y="14" fill="#94a3b8" font-size="10" text-anchor="middle">SCALE 1 : 60</text>
  </g>
</svg>
