<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#eef2f7" stroke-width="1"/>
    </pattern>
    <marker id="tick" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 0 10" stroke="#94a3b8" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="800" height="600" fill="#ffffff"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- Title block -->
  <g font-size="12">
    <rect x="70" y="14" width="360" height="42" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="84" y="31" fill="#0f172a" font-weight="700" font-size="14">INDEPENDENT HOUSE · ELEVATE VILLAS</text>
    <text x="84" y="47" fill="#64748b">Plot 12 · Ground Floor Plan · Carpet ≈ 1,200 sq.ft</text>
    <text x="438" y="40" fill="#94a3b8" font-style="italic">NOT TO SCALE</text>
  </g>

  <!-- North arrow -->
  <g transform="translate(756,40)">
    <path d="M 0 -16 L 5 6 L 0 1 L -5 6 Z" fill="#334155"/>
    <text x="0" y="14" fill="#475569" font-size="10" text-anchor="middle" font-weight="600">N</text>
  </g>

  <!-- Exterior walls (bottom wall gapped: front door + open car porch) -->
  <g stroke="#1e293b" stroke-linecap="round">
    <line x1="70" y1="70" x2="730" y2="70" stroke-width="7"/>
    <line x1="70" y1="540" x2="148" y2="540" stroke-width="7"/>
    <line x1="186" y1="540" x2="540" y2="540" stroke-width="7"/>
    <line x1="70" y1="70" x2="70" y2="540" stroke-width="7"/>
    <line x1="730" y1="70" x2="730" y2="540" stroke-width="7"/>
  </g>

  <!-- Interior walls -->
  <g stroke="#1e293b" stroke-linecap="round">
    <line x1="330" y1="70" x2="330" y2="94" stroke-width="4"/>
    <line x1="330" y1="130" x2="330" y2="340" stroke-width="4"/>
    <line x1="400" y1="70" x2="400" y2="194" stroke-width="4"/>
    <line x1="400" y1="228" x2="400" y2="340" stroke-width="4"/>
    <line x1="260" y1="70" x2="260" y2="150" stroke-width="4"/>
    <line x1="260" y1="150" x2="284" y2="150" stroke-width="4"/>
    <line x1="320" y1="150" x2="330" y2="150" stroke-width="4"/>
    <line x1="330" y1="340" x2="400" y2="340" stroke-width="4"/>
    <line x1="70" y1="340" x2="400" y2="340" stroke-width="4"/>
    <line x1="400" y1="340" x2="730" y2="340" stroke-width="4"/>
    <line x1="400" y1="340" x2="400" y2="418" stroke-width="4"/>
    <line x1="400" y1="454" x2="400" y2="540" stroke-width="4"/>
    <line x1="540" y1="340" x2="540" y2="418" stroke-width="4"/>
    <line x1="540" y1="454" x2="540" y2="540" stroke-width="4"/>
  </g>

  <!-- Door swings -->
  <g stroke="#334155" fill="none" stroke-width="2">
    <path d="M 148 540 A 30 30 0 0 1 118 510"/>
    <line x1="148" y1="540" x2="148" y2="512"/>
    <path d="M 330 130 A 26 26 0 0 0 304 156"/>
    <line x1="330" y1="130" x2="304" y2="130"/>
    <path d="M 320 150 A 22 22 0 0 1 342 172"/>
    <line x1="320" y1="150" x2="342" y2="150"/>
    <path d="M 400 228 A 26 26 0 0 0 374 254"/>
    <line x1="400" y1="228" x2="374" y2="228"/>
    <path d="M 400 454 A 26 26 0 0 1 426 480"/>
    <line x1="400" y1="454" x2="426" y2="454"/>
    <path d="M 540 454 A 26 26 0 0 1 540 480"/>
    <line x1="540" y1="454" x2="540" y2="480"/>
  </g>

  <!-- Room labels -->
  <g text-anchor="middle">
    <text x="200" y="250" fill="#0f172a" font-size="15" font-weight="700">BEDROOM 1</text>
    <text x="200" y="270" fill="#475569" font-size="12">16'0" × 14'0"</text>
    <text x="200" y="288" fill="#94a3b8" font-size="11">≈ 224 sq.ft</text>

    <text x="295" y="110" fill="#475569" font-size="10" font-weight="700">BATH</text>
    <text x="295" y="124" fill="#94a3b8" font-size="9.5">3'6" × 5'0"</text>

    <text x="365" y="200" fill="#64748b" font-size="11" font-weight="600">CORRIDOR</text>

    <text x="565" y="250" fill="#0f172a" font-size="15" font-weight="700">BEDROOM 2</text>
    <text x="565" y="270" fill="#475569" font-size="12">16'6" × 14'0"</text>
    <text x="565" y="288" fill="#94a3b8" font-size="11">≈ 231 sq.ft</text>

    <text x="235" y="440" fill="#0f172a" font-size="15" font-weight="700">LIVING + DINING</text>
    <text x="235" y="460" fill="#475569" font-size="12">20'6" × 12'6"</text>
    <text x="235" y="478" fill="#94a3b8" font-size="11">≈ 256 sq.ft</text>

    <text x="470" y="438" fill="#0f172a" font-size="14" font-weight="700">KITCHEN</text>
    <text x="470" y="456" fill="#94a3b8" font-size="10.5">8'9" × 9'0"</text>

    <text x="635" y="438" fill="#0f172a" font-size="14" font-weight="700">CAR PORCH</text>
    <text x="635" y="456" fill="#94a3b8" font-size="10.5">12'0" × 9'0"</text>
  </g>

  <!-- Overall dimensions -->
  <g stroke="#94a3b8" stroke-width="1.5" marker-start="url(#tick)" marker-end="url(#tick)">
    <line x1="70" y1="558" x2="730" y2="558"/>
    <line x1="70" y1="545" x2="70" y2="571"/>
    <line x1="730" y1="545" x2="730" y2="571"/>
    <line x1="762" y1="70" x2="762" y2="540"/>
    <line x1="748" y1="70" x2="776" y2="70"/>
    <line x1="748" y1="540" x2="776" y2="540"/>
  </g>
  <g fill="#475569" font-size="13" font-weight="600">
    <text x="400" y="576" text-anchor="middle">41'-6"</text>
    <text x="778" y="311" text-anchor="middle">33'-0"</text>
  </g>

  <!-- Scale bar -->
  <g transform="translate(500,572)">
    <line x1="0" y1="0" x2="120" y2="0" stroke="#475569" stroke-width="3"/>
    <line x1="30" y1="-3" x2="30" y2="3" stroke="#475569" stroke-width="3"/>
    <line x1="60" y1="-3" x2="60" y2="3" stroke="#475569" stroke-width="3"/>
    <line x1="90" y1="-3" x2="90" y2="3" stroke="#475569" stroke-width="3"/>
    <text x="60" y="14" fill="#94a3b8" font-size="10" text-anchor="middle">SCALE 1 : 60</text>
  </g>
</svg>
